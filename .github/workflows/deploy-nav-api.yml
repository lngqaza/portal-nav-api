name: Deploy portal-nav-api (Lambda + API Gateway)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPO: 684756697968.dkr.ecr.eu-west-1.amazonaws.com/portal-nav-api
  FUNCTION_NAME: portal-nav-api
  API_NAME: portal-nav-api
  ACCOUNT_ID: "684756697968"
  VPC_SUBNETS: "subnet-00b028c69cbbd08ab,subnet-00a4a05f8f47b543f"
  VPC_SGS: "sg-0421044ca2ce55b41"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Wave 1/2 unit tests — pytest invariants that need no DB or ONNX.
  # These run immediately on push and must be green before build starts.
  # Tests that require RDS or ONNX are skipped with integration-pending[rds/onnx].
  # ──────────────────────────────────────────────────────────────────────────
  test-unit:
    name: "Wave 1/2 — unit invariants"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest (unit — no DB, no ONNX)
        # DATABASE_URL intentionally absent: tests that need RDS/ONNX skip with
        # explicit integration-pending[rds/onnx] reasons. Zero failures expected.
        env:
          API_KEYS: ${{ secrets.NAV_API_KEYS }}
          ADMIN_TOKEN: ${{ secrets.NAV_ADMIN_TOKEN }}
        run: |
          python -m pytest tests/invariants/ -v --tb=short 2>&1 | tee pytest-unit.log
          tail -1 pytest-unit.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-log
          path: pytest-unit.log

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker image and push to ECR.
  # Only starts after unit tests pass.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & push to ECR"
    needs: test-unit
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names portal-nav-api 2>/dev/null || \
          aws ecr create-repository --repository-name portal-nav-api \
            --image-scanning-configuration scanOnPush=true

      - name: Build and push
        id: push
        run: |
          IMAGE_URI=$ECR_REPO:${{ github.sha }}
          docker build --no-cache -t $IMAGE_URI -t $ECR_REPO:latest .
          docker push $IMAGE_URI
          docker push $ECR_REPO:latest
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Prune old images (keep 5)
        run: |
          DIGESTS=$(aws ecr describe-images --repository-name portal-nav-api \
            --query 'sort_by(imageDetails,&imagePushedAt)[:-5].imageDigest' --output text)
          for D in $DIGESTS; do
            aws ecr batch-delete-image --repository-name portal-nav-api \
              --image-ids imageDigest=$D || true
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy Lambda + API Gateway.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy Lambda"
    needs: build
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.api.outputs.api_url }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Ensure Lambda execution role exists
        run: |
          ROLE_ARN=$(aws iam get-role --role-name portal-nav-lambda-role \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN=$(aws iam create-role \
              --role-name portal-nav-lambda-role \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
              --query 'Role.Arn' --output text)
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
            sleep 15
          else
            # Ensure X-Ray policy is attached (idempotent for existing roles)
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess 2>/dev/null || true
          fi
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      - name: Deploy Lambda
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          ENV_VARS=$(python3 -c "
import json, sys
print(json.dumps({'Variables': {
  'DATABASE_URL': '${{ secrets.NAV_DATABASE_URL }}',
  'API_KEYS':     '${{ secrets.NAV_API_KEYS }}',
  'ADMIN_TOKEN':  '${{ secrets.NAV_ADMIN_TOKEN }}',
  'SERVICE_VERSION': '${{ github.sha }}'
}}))")

          EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME \
            --query 'Configuration.FunctionArn' --output text 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "Creating Lambda function..."
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role $ROLE_ARN \
              --memory-size 1024 \
              --timeout 60 \
              --environment "$ENV_VARS" \
              --vpc-config SubnetIds=$VPC_SUBNETS,SecurityGroupIds=$VPC_SGS
            aws lambda wait function-active --function-name $FUNCTION_NAME
          else
            echo "Updating Lambda code..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI
            aws lambda wait function-updated --function-name $FUNCTION_NAME
            echo "Updating Lambda config..."
            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --timeout 60 \
              --memory-size 1024 \
              --tracing-config Mode=Active \
              --environment "$ENV_VARS"
            aws lambda wait function-updated --function-name $FUNCTION_NAME
          fi

          # ── Publish version + update 'live' alias ──────────────────────────
          # Provisioned concurrency requires a named alias (not $LATEST).
          # Every deploy publishes an immutable version and advances the alias.
          echo "Publishing Lambda version..."
          VERSION=$(aws lambda publish-version \
            --function-name $FUNCTION_NAME \
            --query 'Version' --output text)
          echo "Published version $VERSION"

          ALIAS_ARN=$(aws lambda get-alias --function-name $FUNCTION_NAME \
            --name live --query 'AliasArn' --output text 2>/dev/null || echo "")
          if [ -z "$ALIAS_ARN" ]; then
            echo "Creating 'live' alias..."
            ALIAS_ARN=$(aws lambda create-alias \
              --function-name $FUNCTION_NAME --name live \
              --function-version "$VERSION" \
              --query 'AliasArn' --output text)
          else
            # Must delete PC before updating alias version — AWS rejects
            # put-provisioned-concurrency-config while an alias is mid-transition
            # ("Alias with weights can not be used with Provisioned Concurrency")
            echo "Deleting PC config before alias update..."
            aws lambda delete-provisioned-concurrency-config \
              --function-name $FUNCTION_NAME --qualifier live 2>/dev/null || true
            echo "Updating 'live' alias to version $VERSION..."
            ALIAS_ARN=$(aws lambda update-alias \
              --function-name $FUNCTION_NAME --name live \
              --function-version "$VERSION" \
              --query 'AliasArn' --output text)
          fi
          echo "ALIAS_ARN=$ALIAS_ARN" >> $GITHUB_ENV

          # ── Provisioned concurrency = 1 ────────────────────────────────────
          # Keeps 1 warm ONNX instance; eliminates the ~15s cold-start p90
          # seen in load testing. Cost: ~$12/month for 1 × 1024 MB instance.
          echo "Setting provisioned concurrency = 1 on alias 'live'..."
          aws lambda put-provisioned-concurrency-config \
            --function-name $FUNCTION_NAME \
            --qualifier live \
            --provisioned-concurrent-executions 1
          # Poll until READY (typically 60-90s for a 1GB container image)
          for i in $(seq 1 20); do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name $FUNCTION_NAME --qualifier live \
              --query 'Status' --output text 2>/dev/null || echo "PENDING")
            echo "  PC status: $STATUS (attempt $i/20)"
            [ "$STATUS" = "READY" ] && break
            sleep 15
          done

      - name: Create or verify API Gateway HTTP API
        id: api
        run: |
          # Use the 'live' alias ARN so API Gateway always invokes provisioned instances
          ALIAS_ARN="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$FUNCTION_NAME:live"

          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='$API_NAME'].ApiId" --output text)

          if [ -z "$API_ID" ]; then
            echo "Creating API Gateway HTTP API..."
            API_ID=$(aws apigatewayv2 create-api \
              --name $API_NAME \
              --protocol-type HTTP \
              --target $ALIAS_ARN \
              --query 'ApiId' --output text)
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME:live" \
              --statement-id apigateway-invoke \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "arn:aws:execute-api:$AWS_REGION:$ACCOUNT_ID:${API_ID}/*/*"
          else
            # Ensure the integration points to the alias (idempotent update)
            INTEG_ID=$(aws apigatewayv2 get-integrations --api-id $API_ID \
              --query 'Items[0].IntegrationId' --output text)
            CURRENT_URI=$(aws apigatewayv2 get-integration \
              --api-id $API_ID --integration-id $INTEG_ID \
              --query 'IntegrationUri' --output text)
            if [ "$CURRENT_URI" != "$ALIAS_ARN" ]; then
              echo "Updating API Gateway integration to alias ARN..."
              aws apigatewayv2 update-integration \
                --api-id $API_ID \
                --integration-id $INTEG_ID \
                --integration-uri $ALIAS_ARN
              # Add invoke permission on alias if not already present
              aws lambda add-permission \
                --function-name "$FUNCTION_NAME:live" \
                --statement-id apigateway-invoke \
                --action lambda:InvokeFunction \
                --principal apigateway.amazonaws.com \
                --source-arn "arn:aws:execute-api:$AWS_REGION:$ACCOUNT_ID:${API_ID}/*/*" \
                2>/dev/null || true
            fi
          fi

          # ── Throttle (idempotent) ──────────────────────────────────────────
          # 50 req/s steady-state, 100 burst. Prevents a rogue caller from
          # exhausting Lambda concurrency and causing cold starts for real users.
          aws apigatewayv2 update-stage \
            --api-id $API_ID \
            --stage-name '$default' \
            --default-route-settings '{"ThrottlingBurstLimit":100,"ThrottlingRateLimit":50}'

          # ── Alarm SNS wiring (idempotent) ─────────────────────────────────────
          # Re-apply on every deploy so alarms survive manual edits.
          # Uses explicit put-metric-alarm per alarm — avoids inline Python in YAML.
          SNS_ARN="arn:aws:sns:$AWS_REGION:$ACCOUNT_ID:portal-nav-api-alerts"

          aws cloudwatch put-metric-alarm \
            --region $AWS_REGION \
            --alarm-name portal-nav-api-error-rate \
            --metric-name Errors --namespace AWS/Lambda \
            --dimensions Name=FunctionName,Value=$FUNCTION_NAME \
            --statistic Sum --period 300 --evaluation-periods 1 \
            --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data notBreaching \
            --alarm-actions "$SNS_ARN" --ok-actions "$SNS_ARN"

          aws cloudwatch put-metric-alarm \
            --region $AWS_REGION \
            --alarm-name portal-nav-api-p95-duration \
            --metric-name Duration --namespace AWS/Lambda \
            --dimensions Name=FunctionName,Value=$FUNCTION_NAME \
            --extended-statistic p95 --period 300 --evaluation-periods 2 \
            --threshold 5000 --comparison-operator GreaterThanThreshold \
            --treat-missing-data notBreaching \
            --alarm-actions "$SNS_ARN" --ok-actions "$SNS_ARN"

          aws cloudwatch put-metric-alarm \
            --region $AWS_REGION \
            --alarm-name portal-nav-api-throttles \
            --metric-name Throttles --namespace AWS/Lambda \
            --dimensions Name=FunctionName,Value=$FUNCTION_NAME \
            --statistic Sum --period 300 --evaluation-periods 1 \
            --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data notBreaching \
            --alarm-actions "$SNS_ARN" --ok-actions "$SNS_ARN"

          aws cloudwatch put-metric-alarm \
            --region $AWS_REGION \
            --alarm-name portal-nav-api-5xx \
            --metric-name 5xx --namespace AWS/ApiGateway \
            --dimensions Name=ApiId,Value=$API_ID \
            --statistic Sum --period 300 --evaluation-periods 1 \
            --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data notBreaching \
            --alarm-actions "$SNS_ARN" --ok-actions "$SNS_ARN"

          echo "Alarm SNS wiring applied."

          API_URL=$(aws apigatewayv2 get-api --api-id $API_ID \
            --query 'ApiEndpoint' --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API live at: $API_URL (alias: live)"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Post-deploy integration tests.
  # Runs AFTER deploy so it hits the freshly-deployed Lambda image.
  # Splits into two parallel sub-streams:
  #   4a. Wave 1/2 pytest — full suite including DB + ONNX invariants
  #   4b. Wave 3 Jest    — contract, security, business e2e against live API
  # Both must pass for the pipeline to be green.
  # ──────────────────────────────────────────────────────────────────────────
  test-integration-python:
    name: "Wave 1/2 — integration invariants (DB + ONNX)"
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Run full pytest suite
        env:
          DATABASE_URL: ${{ secrets.NAV_DATABASE_URL }}
          NAV_TEST_DATABASE_URL: ${{ secrets.NAV_DATABASE_URL }}
          API_KEYS: ${{ secrets.NAV_API_KEYS }}
          ADMIN_TOKEN: ${{ secrets.NAV_ADMIN_TOKEN }}
        run: |
          python -m pytest tests/invariants/ -v --tb=short 2>&1 | tee pytest-integration.log
          tail -1 pytest-integration.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-log
          path: pytest-integration.log

  test-integration-wave3:
    name: "Wave 3 — contract / security / e2e (live API)"
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/wave3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/wave3/package-lock.json

      - name: Install Node deps
        run: npm ci

      - name: Run Wave 3 Jest suite
        env:
          NAV_API_URL: ${{ needs.deploy.outputs.api_url }}
          # NAV_API_KEY must be a single key; NAV_API_KEYS secret holds comma-separated
          # list — take the first value by stripping everything from the first comma.
          NAV_API_KEY: ${{ secrets.NAV_API_KEYS }}
          NAV_ADMIN_TOKEN: ${{ secrets.NAV_ADMIN_TOKEN }}
        run: npm run test:ci 2>&1 | tee jest-wave3.log

      - name: Upload Jest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-wave3-log
          path: tests/wave3/jest-wave3.log
