name: Deploy portal-nav-api (Lambda + API Gateway)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPO: 684756697968.dkr.ecr.eu-west-1.amazonaws.com/portal-nav-api
  FUNCTION_NAME: portal-nav-api
  API_NAME: portal-nav-api
  ACCOUNT_ID: "684756697968"
  VPC_SUBNETS: "subnet-00b028c69cbbd08ab,subnet-00a4a05f8f47b543f"
  VPC_SGS: "sg-0421044ca2ce55b41"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names portal-nav-api 2>/dev/null || \
          aws ecr create-repository --repository-name portal-nav-api \
            --image-scanning-configuration scanOnPush=true

      - name: Build and push
        id: push
        run: |
          IMAGE_URI=$ECR_REPO:${{ github.sha }}
          docker build --no-cache -t $IMAGE_URI -t $ECR_REPO:latest .
          docker push $IMAGE_URI
          docker push $ECR_REPO:latest
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Prune old images (keep 5)
        run: |
          DIGESTS=$(aws ecr describe-images --repository-name portal-nav-api \
            --query 'sort_by(imageDetails,&imagePushedAt)[:-5].imageDigest' --output text)
          for D in $DIGESTS; do
            aws ecr batch-delete-image --repository-name portal-nav-api --image-ids imageDigest=$D || true
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Ensure Lambda execution role exists
        run: |
          ROLE_ARN=$(aws iam get-role --role-name portal-nav-lambda-role \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$ROLE_ARN" ]; then
            ROLE_ARN=$(aws iam create-role \
              --role-name portal-nav-lambda-role \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
              --query 'Role.Arn' --output text)
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
            aws iam attach-role-policy --role-name portal-nav-lambda-role \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            sleep 15
          fi
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      - name: Deploy Lambda
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          ENV_VARS="Variables={DATABASE_URL=${{ secrets.NAV_DATABASE_URL }},API_KEYS=${{ secrets.NAV_API_KEYS }},ADMIN_TOKEN=${{ secrets.NAV_ADMIN_TOKEN }},SERVICE_VERSION=${{ github.sha }}}"

          EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME \
            --query 'Configuration.FunctionArn' --output text 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "Creating Lambda function..."
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role $ROLE_ARN \
              --memory-size 1024 \
              --timeout 60 \
              --environment "$ENV_VARS" \
              --vpc-config SubnetIds=$VPC_SUBNETS,SecurityGroupIds=$VPC_SGS
            aws lambda wait function-active --function-name $FUNCTION_NAME
          else
            echo "Updating Lambda code..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI
            aws lambda wait function-updated --function-name $FUNCTION_NAME
            echo "Updating Lambda config..."
            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --timeout 60 \
              --memory-size 1024 \
              --environment "$ENV_VARS"
            aws lambda wait function-updated --function-name $FUNCTION_NAME
          fi

      - name: Create or verify API Gateway HTTP API
        run: |
          LAMBDA_ARN=$(aws lambda get-function --function-name $FUNCTION_NAME \
            --query 'Configuration.FunctionArn' --output text)

          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='$API_NAME'].ApiId" --output text)

          if [ -z "$API_ID" ]; then
            echo "Creating API Gateway HTTP API..."
            API_ID=$(aws apigatewayv2 create-api \
              --name $API_NAME \
              --protocol-type HTTP \
              --target $LAMBDA_ARN \
              --query 'ApiId' --output text)
            # Allow API Gateway to invoke Lambda
            aws lambda add-permission \
              --function-name $FUNCTION_NAME \
              --statement-id apigateway-invoke \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "arn:aws:execute-api:$AWS_REGION:$ACCOUNT_ID:${API_ID}/*/*"
          fi

          API_URL=$(aws apigatewayv2 get-api --api-id $API_ID --query 'ApiEndpoint' --output text)
          echo "========================================"
          echo "API live at: $API_URL"
          echo "Health check: $API_URL/health"
          echo "========================================"
