# OWASP Dependency-Check configuration — portal-nav-api
# Docs: https://jeremylong.github.io/DependencyCheck/dependency-check-cli/arguments.html

# NVD API key reduces rate-limiting during CI scans.
# Set NVD_API_KEY secret in GitHub repo to enable.
# nvd.api.key=${NVD_API_KEY}

# Fail on CVSS score >= 7 (HIGH/CRITICAL)
failBuildOnCVSS=7

# Suppress false positives via XML file
suppressionFile=appsec/owasp-dc-suppressions.xml

# Scan these file types
scanFile=requirements.txt
scanFile=tests/wave3/package-lock.json

# Output directory
outputDirectory=reports

# Enable all analysers relevant to this stack
analyzer.python.enabled=true
analyzer.node.enabled=true
analyzer.nodePackage.enabled=true
analyzer.retirejs.enabled=true

# Disable analysers irrelevant to this stack (speeds up scan)
analyzer.assembly.enabled=false
analyzer.nuspec.enabled=false
analyzer.nugetconf.enabled=false
analyzer.composer.enabled=false
analyzer.swift.enabled=false
analyzer.cocoapods.enabled=false
