# OWASP ZAP scan policy — portal-nav-api
# Format: <rule-id>=<IGNORE|WARN|FAIL>
# Docs: https://www.zaproxy.org/docs/alerts/

# ── Active scan rules (DAST) ─────────────────────────────────────────────────

# SQL injection — FAIL (our Lambda uses parameterised queries but verify)
40018=FAIL

# XSS reflected — FAIL
40012=FAIL

# XSS persistent — FAIL
40014=FAIL

# Path traversal — FAIL
6=FAIL

# Remote code execution — FAIL
20018=FAIL

# ── Passive scan rules ────────────────────────────────────────────────────────

# Missing security headers — WARN (Lambda API GW manages headers)
10021=WARN   # X-Content-Type-Options
10038=WARN   # Content Security Policy
10098=WARN   # Cross-Domain Misconfiguration

# Cookie without HttpOnly — WARN (API is stateless, no cookies)
10010=WARN

# Information disclosure — WARN
10024=WARN   # Information Disclosure - Sensitive Information in URL
10027=WARN   # Information Disclosure - Suspicious Comments

# ── Ignore rules (not applicable to this stateless JSON API) ─────────────────

# Viewstate — IGNORE (not an ASP.NET app)
10032=IGNORE

# Session ID in URL — IGNORE (JWT in headers only)
3=IGNORE

# Login page password autocomplete — IGNORE (no login page)
10012=IGNORE
