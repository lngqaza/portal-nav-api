[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header
markers =
    unit: Tests that need no DB or model (fast, pure logic)
    integration: Tests that need DB connection
    model: Tests that need ONNX models loaded
    integration_pending: Tests blocked by infra gap (rds or onnx); run in CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
